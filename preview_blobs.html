<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ブロブ形状 プレビュー</title>
  <style>
    body { background: #fff3e2; display: flex; flex-wrap: wrap; gap: 40px; padding: 60px; align-items: center; justify-content: center; }

    .blob {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
    }

    /* ===== 形バリエーション ===== */
    .blob-1 { background: #abebea; border-radius: 60% 40% 55% 45% / 50% 60% 40% 55%; }
    .blob-2 { background: #a5da96; border-radius: 40% 60% 45% 55% / 60% 40% 55% 45%; }
    .blob-3 { background: #efaf96; border-radius: 55% 45% 60% 40% / 45% 55% 40% 60%; }
    .blob-4 { background: #f9f09c; border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%; }
    .blob-5 { background: #99b8f7; border-radius: 50% 50% 60% 40% / 40% 60% 45% 55%; }
    .blob-6 { background: #abebea; border-radius: 35% 65% 50% 50% / 55% 45% 60% 40%; width: 200px; height: 120px; }
    .blob-7 { background: #efaf96; border-radius: 65% 35% 40% 60% / 40% 60% 50% 50%; width: 130px; height: 180px; }

    /* カードっぽいサンプル */
    .card-sample {
      position: relative;
      background: white;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 260px;
    }

    .card-sample .blob-icon {
      width: 80px;
      height: 80px;
      border-radius: 45% 55% 60% 40% / 55% 45% 40% 60%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 16px;
    }

    .card-sample h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #2c4a7c;
      margin-bottom: 8px;
      font-family: sans-serif;
    }

    .card-sample p {
      font-size: 0.9rem;
      color: #333;
      line-height: 1.7;
      font-family: sans-serif;
    }

    h2 { width: 100%; font-family: sans-serif; color: #2c4a7c; }
  </style>
</head>
<body>

  <h2>形バリエーション</h2>

  <div class="blob blob-1">🏙️</div>
  <div class="blob blob-2">💼</div>
  <div class="blob blob-3">🗳️</div>
  <div class="blob blob-4">🧒</div>
  <div class="blob blob-5">🙋</div>
  <div class="blob blob-6">🌱</div>
  <div class="blob blob-7">⭐</div>

  <h2>カードに使うとこんな感じ</h2>

  <div class="card-sample">
    <div class="blob-icon" style="background:#abebea;">🏙️</div>
    <h3>こどもだけの小さな町</h3>
    <p>7歳〜15歳の子どもが市民として登録。自分たちで運営する「まち」がここに生まれます。</p>
  </div>

  <div class="card-sample">
    <div class="blob-icon" style="background:#a5da96;">💼</div>
    <h3>お仕事をして、お給料をもらう</h3>
    <p>まちの中にはいろんなお仕事があります。働いてもらったお給料で、遊んだりできます。</p>
  </div>

  <div class="card-sample">
    <div class="blob-icon" style="background:#efaf96;">🗳️</div>
    <h3>まちのことは、みんなで決める</h3>
    <p>税金の使い道も、まちのルールも、子どもたちが話し合って決めます。</p>
  </div>

</body>
</html>
